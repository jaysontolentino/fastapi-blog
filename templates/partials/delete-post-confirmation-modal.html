<!-- Delete-confirmation modal -->
    <div id="delete-post-modal"
         class="modal hidden fixed inset-0 z-100 items-center justify-center p-4 bg-ink/50 backdrop-blur-sm opacity-0 transition-opacity duration-200">
      <div data-modal-dialog
           class="relative bg-paper rounded-lg border border-paper-3 shadow-xl w-full max-w-sm p-6 opacity-0 scale-95 translate-y-2 transition-all duration-200"
           role="dialog" aria-modal="true" aria-labelledby="delete-post-modal-title">

        <button type="button" data-modal-dismiss aria-label="Close"
                class="absolute top-3 right-3 p-1.5 rounded-md text-ink-faint hover:text-ink-muted hover:bg-paper-2 transition-colors duration-150 cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-paper">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M4 4l8 8M12 4l-8 8"/>
          </svg>
        </button>

        <div class="flex items-start gap-3 pr-6">
          <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 bg-danger/10 text-danger">
            <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
              <path d="M8 1.5L15 14H1L8 1.5Z"/>
              <path d="M8 6.25v3M8 11.25h.01" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="min-w-0">
            <h2 id="delete-post-modal-title" class="font-serif text-lg text-ink">Delete post?</h2>
            <p class="text-sm text-ink-muted mt-1 leading-relaxed">This action cannot be undone. Are you sure you want to delete this post?</p>
          </div>
        </div>

        <div class="flex items-center justify-end gap-3 mt-6">
          <button type="button" data-modal-dismiss class="h-10 px-4 rounded-md text-sm font-medium transition-colors duration-150 cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-paper border border-paper-3 text-ink-muted hover:bg-paper-2 hover:text-ink">
            Cancel
          </button>
          <button id="btn_delete_post" type="button" class="h-10 px-4 rounded-md text-sm font-medium transition-colors duration-150 cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-paper bg-danger text-white hover:bg-[#9c2828]">
            Delete
          </button>
        </div>
      </div>
    </div>
