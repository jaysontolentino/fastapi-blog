{% extends "layouts/base.html" %}

{% block main %}
<header class="mb-8 flex items-center gap-3">
  <img src={{ user.img_path }} alt={{ user.username }} class="w-12 h-12 rounded-full object-cover border border-paper-3">
  <div>
    <p class="text-[0.72rem] font-medium tracking-[0.12em] uppercase text-accent mb-1">Author</p>
    <h1 class="font-serif text-2xl text-ink">{{ user.username }}</h1>
  </div>
</header>

{% if posts %}
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
{% for post in posts %}
  {% include "partials/post-card.html" %}
{% endfor %}
</div>
{% else %}
<div class="text-center py-20 text-ink-faint text-sm">No posts yet.</div>
{% endif %}
{% endblock main %}
