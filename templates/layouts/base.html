<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FastAPI blog"
    />
    <title>
      {% if title %}{{ title }} · MyBlog{% else %}MyBlog{% endif %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href={{ url_for('static', path='css/main.css') }} />
  </head>
  <body class="bg-paper text-ink font-sans min-h-screen flex flex-col">
    {% include 'partials/navbar.html' %}

    <main class="flex-1 max-w-5xl mx-auto w-full px-4 md:px-6 py-10">
      {% block main %}{% endblock main %}
    </main>

    {% include 'partials/footer.html' %}

    {% include 'partials/success-modal.html' %}

    {% include 'partials/error-modal.html' %}

    <script src="{{ url_for('static', path='js/modal.js') }}"></script>

    <script type="module">
      import { getCurrentUser, logout } from '/public/js/auth.js';

      async function updateUI() {
        const currentUser = await getCurrentUser();
        const authedEl = document.getElementById('authed-nav-items');
        const notAuthedEl = document.getElementById('not-authed-nav-items');

        if (currentUser) {
          authedEl.classList.add('flex');
          authedEl.classList.remove('hidden');
          notAuthedEl.classList.add('hidden');
          notAuthedEl.classList.remove('flex');

          const userImgEl = document.getElementById('user-profile-img');
          const userNameEl = document.getElementById('user-profile-username');

          userImgEl.src = currentUser.img_path;
          userNameEl.textContent = currentUser.username;

          const btnLogout = document.getElementById('btn_logout');

          btnLogout.addEventListener('click', function () {
            logout();
            window.location.reload();
          });
        } else {
          authedEl.classList.add('hidden');
          authedEl.classList.remove('flex');
          notAuthedEl.classList.add('flex');
          notAuthedEl.classList.remove('hidden');
        }
      }

      updateUI();
    </script>

    <script type="module">

      import {extractError} from '/public/js/utils.js'
      import {getToken} from '/public/js/auth.js'

      const newPostForm = document.getElementById('new_post_form')

      newPostForm.addEventListener('submit', async (e) => {

        e.preventDefault();

        const formData = new FormData(newPostForm);
        const postData = Object.fromEntries(formData.entries());

        const tags = postData.tags ? postData.tags.split(",").map(i => i.trim()) : [];
        postData.tags = tags;

        try {
          // POST to our API as JSON
          const response = await fetch("/api/posts", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${getToken()}`,
            },
            body: JSON.stringify(postData),
          });

          if (response.ok) {
            const data = await response.json();
            document.getElementById("successMessage").textContent =
                `Post "${data.title}" created successfully!`;

            Modal.close('#new-post-modal');

            Modal.open("#success-modal", {
              onDismis: () => {
                // Reload page after modal is hidden to show new post
                window.location.reload();
              }
            });

            // Clear form
            newPostForm.reset();

          } else {

            const {message} = await extractError(response);

            document.getElementById("errorMessage").textContent = message;

            Modal.open("#error-modal");
          }
        } catch (error) {
          console.log("Error occured >> ", error)
            document.getElementById("errorMessage").textContent =
            "Network error. Please check your connection and try again.";
            Modal.open("#error-modal");
        }
      });

    </script>
    {% block script %}{% endblock script %}
  </body>
</html>
